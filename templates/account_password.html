<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change password | Elastic Monitor</title>
    <link rel="stylesheet" href="/static/login.css?v=20260429">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-bg"></div>
    <main class="login-page">
        <section class="login-brand">
            <div class="login-brand-icon"><i class="fas fa-key"></i></div>
            <h1>Change password</h1>
            <p>Enter your current password, then choose a new one.</p>
        </section>
        <section class="login-card">
            <h2>Update credentials</h2>
            <p class="login-sub">Minimum 4 characters for the new password.</p>
            <form id="pw-form" onsubmit="event.preventDefault(); submitChange();">
                <label for="current_password">Current password</label>
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
                </div>
                <label for="new_password">New password</label>
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input id="new_password" name="new_password" type="password" autocomplete="new-password" required minlength="4">
                </div>
                <label for="new_password_confirm">Confirm new password</label>
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input id="new_password_confirm" name="new_password_confirm" type="password" autocomplete="new-password" required minlength="4">
                </div>
                <button type="submit" class="login-submit"><span>Save</span><i class="fas fa-check"></i></button>
                <div id="error" class="login-error" role="alert"></div>
            </form>
            <p class="login-footer-link"><a href="/dashboard"><i class="fas fa-arrow-left"></i> Back to dashboard</a></p>
        </section>
    </main>
    <script src="/static/account_password.js?v=20260429"></script>
</body>
</html>
